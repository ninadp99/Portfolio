<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:oklch(98% 0.004 75);color:oklch(22% 0.015 60);font-family:'Work Sans',system-ui,sans-serif;text-wrap:pretty}
  a{color:oklch(46% 0.16 276);text-decoration:none}
  a:hover{color:oklch(40% 0.16 276)}
</style>
</helmet>

<div style="max-width:820px;margin:0 auto;padding:0 32px 120px">
  <nav style="padding:28px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(38,32,25,0.08);margin-bottom:56px">
    <a href="Home.dc.html" style="font-weight:800;font-size:15px;color:oklch(22% 0.015 60)">&larr; Ninad Pawar</a>
    <a href="Home.dc.html#projects" style="font-size:13px;font-weight:600;color:oklch(45% 0.02 60)">All Projects</a>
  </nav>

  <div style="font-size:13px;font-weight:600;color:oklch(46% 0.16 276);margin-bottom:14px">{{ data.company }} &middot; {{ data.dates }}</div>
  <h1 style="font-size:38px;font-weight:800;line-height:1.15;letter-spacing:-0.5px;margin:0 0 18px">{{ data.title }}</h1>
  <p style="font-size:17px;line-height:1.65;color:oklch(45% 0.02 60);margin:0 0 40px;max-width:620px">{{ data.tagline }}</p>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:56px">
    <sc-for list="{{ data.results }}" as="r" hint-placeholder-count="3">
      <div style="background:#fff;border:1px solid rgba(38,32,25,0.08);border-radius:12px;padding:20px">
        <div style="font-size:24px;font-weight:800;color:oklch(46% 0.16 276);margin-bottom:6px">{{ r.value }}</div>
        <div style="font-size:12.5px;color:oklch(45% 0.02 60);line-height:1.5">{{ r.label }}</div>
      </div>
    </sc-for>
  </div>

  <div style="font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:oklch(22% 0.015 60);margin-bottom:14px">The Challenge</div>
  <p style="font-size:15.5px;line-height:1.75;color:oklch(45% 0.02 60);margin:0 0 40px">{{ data.challenge }}</p>

  <div style="font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:oklch(22% 0.015 60);margin-bottom:16px">The Approach</div>
  <div style="display:flex;flex-direction:column;gap:20px;margin-bottom:40px">
    <sc-for list="{{ approachIdx }}" as="a" hint-placeholder-count="3">
      <div style="display:grid;grid-template-columns:28px 1fr;gap:14px">
        <div style="width:28px;height:28px;border-radius:50%;background:oklch(93% 0.03 276);color:oklch(40% 0.16 276);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center">{{ a.idx }}</div>
        <p style="font-size:15px;line-height:1.7;color:oklch(45% 0.02 60);margin:0">{{ a.step }}</p>
      </div>
    </sc-for>
  </div>

  <div style="font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:oklch(22% 0.015 60);margin-bottom:14px">Tech &amp; Skills</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:56px">
    <sc-for list="{{ data.tech }}" as="t" hint-placeholder-count="4">
      <span style="background:#fff;border:1px solid rgba(38,32,25,0.1);border-radius:14px;padding:6px 14px;font-size:12.5px;color:oklch(45% 0.02 60)">{{ t }}</span>
    </sc-for>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;padding-top:32px;border-top:1px solid rgba(38,32,25,0.08)">
    <a href="{{ data.prevSlug }}" style="font-size:14px;font-weight:600">&larr; {{ data.prevTitle }}</a>
    <a href="{{ data.nextSlug }}" style="font-size:14px;font-weight:600">{{ data.nextTitle }} &rarr;</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;data&quot;: {&quot;editor&quot;: null, &quot;default&quot;: {}, &quot;tsType&quot;: &quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const data = this.props.data || {};
    const approach = (data.approach || []).map((step, i) => ({ step, idx: i + 1 }));
    return { data, approachIdx: approach };
  }
}

</script>
</body>
</html>
